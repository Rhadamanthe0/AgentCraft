name: Minecraft bench

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
    inputs:
      pool_mode:
        description: 'Pool : adaptive (regule CPU/memoire) ou fixed (CI_POOL_SIZE, comparaison entre commits)'
        type: choice
        options: [fixed, adaptive]
        default: fixed
      variation_seed:
        description: 'Graine des arenes (vide = SHA du commit) : meme graine pour comparer deux modes'
        type: string
        default: ''

permissions:
  contents: read

# One pending run per branch (a shared group let GitHub cancel the pending run
# of one branch when another branch pushed); a new push never interrupts a
# running bench. The runner is shared by the organisation's private projects:
# every run has its own compose project (mc-ci-<run id>-...) and cleans up only
# what it recorded (ci/cleanup.py).
concurrency:
  group: minecraft-bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  minecraft:
    if: github.event.repository.private == true
    # MINIPC-CLEM : Linux, runner en conteneur, Podman rootless par socket
    # (clients docker et docker compose). Ports publies injoignables depuis le
    # conteneur du runner (localhost = le runner) : CI_ENDPOINT_MODE=ip, IP des conteneurs du projet.
    runs-on: [self-hosted, linux, x64, minipc, podman]
    # Scenarios composites jusqu a 45 min, lances en premier (chemin critique).
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pool and admission controller on simulated metrics
        run: python3 -m unittest ci/test_capacity.py ci/test_pool.py
      - name: Run unit regressions and real Minecraft tests
        # Le banc n a QUE la cle secondaire (espace OpenCode de test) : aucune
        # bascule possible vers la cle principale, qui n est pas transmise.
        # Elle ne va qu au conteneur jetable des bots, jamais dans une image,
        # un artefact ou un journal. report.keyCheck verifie la cle servie.
        env:
          PLANNER_API_KEY: ${{ secrets.PLANNER_API_KEY }}
          CI_EXPECT_KEY: primary
          CI_ENDPOINT_MODE: ip
          # Pool adaptatif (ci/capacity.py) : admissions sous 75 % de l enveloppe
          # (450 % sur 600 %) et 4 Gio de reserve CI + hote ; sans mesures
          # fiables, repli fixe a CI_POOL_SIZE (16, mesure a 400 %).
          # Fixe par defaut (comparaison meme graine, 800 %) : fixe 16 = 219 s
          # 65/65 ; adaptatif un a un 347 s, par lots 297 s puis 292 s (22
          # workers, deux niveaux perdus). L adaptatif reste au choix (dispatch).
          CI_POOL_MODE: ${{ inputs.pool_mode || 'fixed' }}
          # Enveloppe CI vue du runner (cgroupns prive : son /sys/fs/cgroup n est
          # que sa feuille) : slice user-1008 (podman-ci, CPUQuota 600 % depuis
          # le 2026-09-28, choix du proprietaire pour laisser de la marge aux
          # autres services de la machine ; MemoryHigh 14G, MemoryMax 16G) montee
          # en lecture seule par le quadlet du runner (infra-deploy). Absente =>
          # repli fixe, ecrit dans le rapport.
          CI_METRICS_CGROUP: /host/ci-cgroup
          CI_ENVELOPE_CPU_PCT: '600'
          CI_POOL_SIZE: '16'
          CI_VARIATION_SEED: ${{ inputs.variation_seed }}
        run: python3 ci/run.py --suite all
      - name: Remove any remaining disposable test containers
        if: always()
        run: python3 ci/cleanup.py
      - name: Publish report, logs and movement traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minecraft-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14
