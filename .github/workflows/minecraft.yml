name: Minecraft bench

on:
  push:
    # No PR event executes a secret-bearing job. Dependabot and docs branches
    # run only the small, unprivileged checks when the Git diff permits it.
    branches: [main, 'claude/**', 'dependabot/**', 'docs/**']
  workflow_dispatch:
    inputs:
      pool_mode:
        description: 'Pool : adaptive (regule CPU/memoire) ou fixed (CI_POOL_SIZE, comparaison entre commits)'
        type: choice
        options: [fixed, adaptive]
        default: fixed
      variation_seed:
        description: 'Graine des arenes (vide = SHA du commit) : meme graine pour comparer deux modes'
        type: string
        default: ''
      random_seed:
        description: 'Graine des arenes aleatoires (vide = tiree au hasard) : rejoue un jumeau ~aleatoire (variation.graine)'
        type: string
        default: ''
      levels:
        description: 'Niveaux a jouer : tout, unitaires, ou motifs (composite/*, trees/pillar*) ; vide = tout'
        type: string
        default: ''
      base_model:
        description: 'Modele du banc pour plan, brief et chat le temps de ce lancement (vide = ci/models.env) : A/B quand le modele du banc est sans quota'
        type: string
        default: ''

permissions:
  contents: read

# One pending run per branch. A new branch push supersedes its old bench;
# main is never interrupted. Cleanup always runs, targeting only the project
# recorded before the first container (mc-ci-<run id>-...).
concurrency:
  group: minecraft-bench-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Git-diff based classifier, fail closed. Git history includes main so a
  # branch's LAST commit alone cannot launder earlier code changes as docs.
  classify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 8
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Determine required validation from the full Git diff
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo 'mode=full' >> "$GITHUB_OUTPUT"
          elif [ "$REF" = refs/heads/main ]; then
            python3 ci/change_scope.py --base "$BEFORE" --head "$GITHUB_SHA" --output "$GITHUB_OUTPUT"
          else
            base=$(git merge-base HEAD refs/remotes/origin/main)
            # A branch cannot approve its own reduced validation by rewriting
            # this classifier. Use the protected main version if available.
            if git cat-file -e refs/remotes/origin/main:ci/change_scope.py 2>/dev/null; then
              git show refs/remotes/origin/main:ci/change_scope.py > "$RUNNER_TEMP/trusted_change_scope.py"
              python3 "$RUNNER_TEMP/trusted_change_scope.py" --base "$base" --head "$GITHUB_SHA" --output "$GITHUB_OUTPUT"
            else
              # First rollout of this policy: never skip the full bench.
              echo 'mode=full' >> "$GITHUB_OUTPUT"
            fi
          fi

  # No secrets, model gateway, Paper or Docker. Even Dependabot runs this
  # job with read-only checkout and no lifecycle scripts in npm ci.
  lightweight:
    needs: classify
    if: >-
      needs.classify.result == 'success' &&
      (needs.classify.outputs.mode == 'docs' || needs.classify.outputs.mode == 'deps')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify deny-by-default classifier
        run: python3 -m unittest ci/test_change_scope.py
      - name: Install the locked dependencies without package scripts
        if: needs.classify.outputs.mode == 'deps'
        run: npm ci --prefix bot --ignore-scripts --no-audit --no-fund
      - name: All Python offline regressions
        if: needs.classify.outputs.mode == 'deps'
        run: python3 -m unittest ci/test_capacity.py ci/test_pool.py ci/test_selection.py ci/test_keyprobe.py ci/test_promotion.py ci/test_ab.py ci/test_ouvert.py ci/test_rejeu.py ci/test_plafond.py ci/test_perturbations.py ci/test_unit_runner.py ci/test_conteneur.py ci/test_github_runner.py ci/test_change_scope.py
      - name: Complete Node unit suite (same UNIT manifest as Minecraft)
        if: needs.classify.outputs.mode == 'deps'
        env:
          NODE_PATH: ${{ github.workspace }}/bot/node_modules
        run: |
          mapfile -t tests < <(python3 -c 'import sys; sys.path.insert(0, "ci"); from run import UNIT; [print("tmp/" + t) for t in UNIT]')
          if [ "${#tests[@]}" -lt 76 ]; then
            echo 'Complete unit manifest missing or shortened: no reduced validation' >&2
            exit 1
          fi
          timeout --signal=TERM --kill-after=10s 300s node --test --test-concurrency=8 "${tests[@]}"
  minecraft-bench:
    needs: classify
    # Only the owner may launch/re-run the secret-bearing job in this exact
    # repository. No PR event, no fork. Workflow authors must remain trusted:
    # write access could otherwise introduce another workflow reading secrets.
    if: >-
      needs.classify.result == 'success' &&
      needs.classify.outputs.mode == 'full' &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')) &&
      github.repository_id == '1385815795' &&
      github.actor_id == '37266002' &&
      github.triggering_actor == 'Rhadamanthe0' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # Keep MINIPC while private; switch to a disposable standard GitHub VM
    # once public. This does not change the repository's visibility.
    runs-on: ${{ github.event.repository.private && fromJSON(format('["self-hosted","linux","x64","minipc","rhada-persistent-v1","rhada-job-minecraft","rhada-run-{0}-{1}"]', github.run_id, github.run_attempt)) || 'ubuntu-24.04' }}
    env:
      # Podman needs its native build; GitHub Docker uses BuildKit.
      DOCKER_BUILDKIT: ${{ github.event.repository.private && '0' || '1' }}
      COMPOSE_BAKE: 'false'
      # MINIPC defaults; hosted setup overrides them through GITHUB_ENV.
      CI_GITHUB_HOSTED: '0'
      CI_ENDPOINT_MODE: ip
      CI_METRICS_CGROUP: /host/ci-cgroup
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare the public GitHub runner
        if: github.event.repository.private == false
        run: bash ci/setup-github-runner.sh
      - name: Pool and admission controller on simulated metrics
        run: python3 -m unittest ci/test_capacity.py ci/test_pool.py ci/test_selection.py ci/test_keyprobe.py ci/test_promotion.py ci/test_ab.py ci/test_ouvert.py ci/test_rejeu.py ci/test_plafond.py ci/test_perturbations.py ci/test_unit_runner.py ci/test_conteneur.py ci/test_github_runner.py ci/test_change_scope.py
      # Main always plays everything. Branches use the final Banc: trailer;
      # manual runs use levels. Values are validated before being passed on.
      - name: Choose the levels for this commit
        id: levels
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          INPUT_LEVELS: ${{ inputs.levels }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            levels=${INPUT_LEVELS:-tout}
          elif [ "$REF" = refs/heads/main ]; then
            levels=tout
          else
            levels=$(git log -1 --format='%(trailers:key=Banc,valueonly,separator=%x20)' HEAD | tr -s ' \n' ' ' | sed 's/^ //; s/ $//')
            levels=${levels:-tout}
          fi
          if ! printf '%s' "$levels" | grep -Eq '^[A-Za-z0-9_./*?~, -]+$'; then
            echo "Ligne Banc illisible : $levels" >&2
            exit 1
          fi
          if [ "$levels" != unitaires ]; then
            CI_LEVELS="$levels" python3 -c 'import sys; sys.path.insert(0, "ci"); import trees; bad = trees.unmatched_patterns(); bad and sys.exit("Motifs sans aucun niveau : " + " ".join(bad))'
          fi
          suite=all
          [ "$levels" = unitaires ] && suite=unit
          echo "Niveaux : $levels (suite $suite)"
          echo "levels=$levels" >> "$GITHUB_OUTPUT"
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
      - name: Override the bench model for this run
        if: github.event_name == 'workflow_dispatch' && inputs.base_model != ''
        env:
          BASE_MODEL: ${{ inputs.base_model }}
        run: |
          if ! printf '%s' "$BASE_MODEL" | grep -Eq '^(openai/)?[A-Za-z0-9][A-Za-z0-9.-]{0,63}$'; then
            echo "Modele illisible : $BASE_MODEL" >&2
            exit 1
          fi
          sed -i -E "s#^(PLANNER_MODEL|PLANNER_MODEL_PLAN|PLANNER_MODEL_BRIEF|PLANNER_MODEL_CHAT|PLANNER_MODEL_COMPACT)=.*#\1=$BASE_MODEL#" ci/models.env
          grep -E '^PLANNER_MODEL' ci/models.env
      - name: Run unit regressions and real Minecraft tests
        # Only this authorized job gets the keys; no secret is baked into an
        # image. keyprobe and keyCheck keep the existing single-key contract.
        env:
          PLANNER_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CI_POOL_MODE: ${{ inputs.pool_mode || 'fixed' }}
          # Same envelope and pool on both runners. Missing adaptive metrics
          # still impose the fixed fallback, recorded in the report.
          CI_ENVELOPE_CPU_PCT: '400'
          CI_POOL_SIZE: '10'
          CI_VARIATION_SEED: ${{ inputs.variation_seed }}
          CI_RANDOM_SEED: ${{ inputs.random_seed }}
          CI_LEVELS: ${{ steps.levels.outputs.levels }}
        run: python3 ci/run.py --suite "${{ steps.levels.outputs.suite }}"
      - name: Remove any remaining disposable test containers
        if: always()
        run: python3 ci/cleanup.py
      - name: Publish report, logs and movement traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minecraft-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14
      # A partial bench can measure, but can never authorize a merge.
      - name: Full bench passed on this commit
        if: always()
        env:
          LEVELS: ${{ steps.levels.outputs.levels }}
          RESULT: ${{ job.status }}
          BASE_MODEL: ${{ inputs.base_model }}
        run: |
          if [ -n "$BASE_MODEL" ]; then
            echo "Modele du banc remplace ($BASE_MODEL) : mesure seulement, pas de fusion." >&2
            exit 1
          fi
          if [ "$RESULT" = skipped ] || [ -z "$LEVELS" ]; then
            echo "Banc saute ($RESULT) : aucun niveau joue, pas de fusion." >&2
            exit 1
          fi
          if [ "$LEVELS" != tout ]; then
            echo "Banc partiel ($LEVELS) : la fusion exige un banc complet reussi (commit sans ligne Banc:, ou Banc: tout)." >&2
            exit 1
          fi
          if [ "$RESULT" != success ]; then
            echo "Banc complet en echec ($RESULT) : pas de fusion." >&2
            exit 1
          fi
          echo "Banc complet reussi : fusion permise."

  # A skipped job is accepted by GitHub required checks, so this final gate
  # always runs. It never treats a missing full AND missing lightweight run
  # as validated. The public context remains ruleset 24300678's banc-complet.
  minecraft:
    name: banc-complet
    needs: [classify, minecraft-bench, lightweight]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require the correct completed validation for this Git diff
        env:
          CLASS_RESULT: ${{ needs.classify.result }}
          MODE: ${{ needs.classify.outputs.mode }}
          BENCH_RESULT: ${{ needs.minecraft-bench.result }}
          QUICK_RESULT: ${{ needs.lightweight.result }}
        run: |
          if [ "$CLASS_RESULT" != success ]; then
            echo "Scope check missing or failed ($CLASS_RESULT): merge denied." >&2
            exit 1
          fi
          if [ "$MODE" = docs ] || [ "$MODE" = deps ]; then
            if [ "$QUICK_RESULT" != success ] || [ "$BENCH_RESULT" != skipped ]; then
              echo "Incomplete lightweight validation ($MODE, quick=$QUICK_RESULT, bench=$BENCH_RESULT): merge denied." >&2
              exit 1
            fi
            echo "Verified $MODE-only change on exact commit: no model/Minecraft run required."
            exit 0
          fi
          if [ "$MODE" != full ] || [ "$BENCH_RESULT" != success ] || [ "$QUICK_RESULT" != skipped ]; then
            echo "Full Minecraft validation missing, skipped, partial or failed (mode=$MODE, bench=$BENCH_RESULT, quick=$QUICK_RESULT): merge denied." >&2
            exit 1
          fi
          echo 'Full Minecraft bench succeeded on this commit: merge permitted.'
