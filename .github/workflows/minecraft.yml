name: Minecraft bench

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

# One pending run per branch (a shared group let GitHub cancel the pending run
# of one branch when another branch pushed). The single self-hosted runner
# already runs one job at a time; a new push never interrupts a running bench.
concurrency:
  group: minecraft-bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  minecraft:
    if: github.event.repository.private == true
    runs-on: [self-hosted, Windows, X64, minecraft]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run unit regressions and real Minecraft tests
        # The planner keys only reach the disposable bot container (tree missions).
        env:
          PLANNER_API_KEY: ${{ secrets.PLANNER_API_KEY }}
          # Cles des fournisseurs tiers (bot/model-chain.js PROVIDER_KEYS), vides si absentes.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Second espace OpenCode (alias `modele@go2`, bot/model-chain.js KEY_ALIASES).
          OPENCODE_SECONDARY_API_KEY: ${{ secrets.OPENCODE_SECONDARY_API_KEY }}
        run: python ci/run.py --suite all
      - name: Remove any remaining disposable test containers
        if: always()
        run: python ci/cleanup.py
      - name: Publish report, logs and movement traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minecraft-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14
