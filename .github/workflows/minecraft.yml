name: Minecraft bench

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
    inputs:
      pool_mode:
        description: 'Pool : adaptive (regule CPU/memoire) ou fixed (CI_POOL_SIZE, comparaison entre commits)'
        type: choice
        options: [fixed, adaptive]
        default: fixed
      variation_seed:
        description: 'Graine des arenes (vide = SHA du commit) : meme graine pour comparer deux modes'
        type: string
        default: ''
      random_seed:
        description: 'Graine des arenes aleatoires (vide = tiree au hasard) : rejoue un jumeau ~aleatoire (variation.graine)'
        type: string
        default: ''
      levels:
        description: 'Niveaux a jouer : tout, unitaires, ou motifs (composite/*, trees/pillar*) ; vide = tout'
        type: string
        default: ''
      base_model:
        description: 'Modele du banc pour plan, brief et chat le temps de ce lancement (vide = ci/models.env) : A/B quand le modele du banc est sans quota'
        type: string
        default: ''

permissions:
  contents: read

# One pending run per branch (a shared group let GitHub cancel the pending run
# of one branch when another branch pushed); a new push never interrupts a
# running bench. The runner is shared by the organisation's private projects:
# every run has its own compose project (mc-ci-<run id>-...) and cleans up only
# what it recorded (ci/cleanup.py).
concurrency:
  group: minecraft-bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  minecraft:
    if: github.event.repository.private == true
    # MINIPC-CLEM : Linux, runner en conteneur, Podman rootless par socket
    # (clients docker et docker compose). Ports publies injoignables depuis le
    # conteneur du runner (localhost = le runner) : CI_ENDPOINT_MODE=ip, IP des conteneurs du projet.
    runs-on: [self-hosted, linux, x64, minipc, podman]
    outputs:
      levels: ${{ steps.levels.outputs.levels }}
    # Scenarios composites jusqu a 45 min, lances en premier (chemin critique).
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pool and admission controller on simulated metrics
        run: python3 -m unittest ci/test_capacity.py ci/test_pool.py ci/test_selection.py ci/test_keyprobe.py ci/test_promotion.py ci/test_ab.py ci/test_ouvert.py ci/test_rejeu.py ci/test_plafond.py
      # Tests a jouer (demande du proprietaire, 2026-10-01) : tout le banc sur
      # main ; sur une branche, ce que le commit demande par sa ligne finale
      # `Banc: <motifs>` (`Banc: unitaires` = tests unitaires seuls ; sans
      # ligne, tout le banc) ; au lancement manuel, l entree `levels`. Le message passe par
      # l environnement, jamais interpole dans le script, et seuls des noms de
      # niveaux et des jokers sont acceptes.
      - name: Choose the levels for this commit
        id: levels
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          INPUT_LEVELS: ${{ inputs.levels }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            levels=${INPUT_LEVELS:-tout}
          elif [ "$REF" = refs/heads/main ]; then
            levels=tout
          else
            levels=$(git log -1 --format='%(trailers:key=Banc,valueonly,separator=%x20)' HEAD | tr -s ' \n' ' ' | sed 's/^ //; s/ $//')
            levels=${levels:-tout}
          fi
          if ! printf '%s' "$levels" | grep -Eq '^[A-Za-z0-9_./*?~, -]+$'; then
            echo "Ligne Banc illisible : $levels" >&2
            exit 1
          fi
          if [ "$levels" != unitaires ]; then
            CI_LEVELS="$levels" python3 -c 'import sys; sys.path.insert(0, "ci"); import trees; bad = trees.unmatched_patterns(); bad and sys.exit("Motifs sans aucun niveau : " + " ".join(bad))'
          fi
          suite=all
          [ "$levels" = unitaires ] && suite=unit
          echo "Niveaux : $levels (suite $suite)"
          echo "levels=$levels" >> "$GITHUB_OUTPUT"
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
      # Lancement manuel seulement : remplace le modele de plan, brief et chat
      # de ci/models.env dans ce checkout (sonde de cle et bots compris).
      - name: Override the bench model for this run
        if: github.event_name == 'workflow_dispatch' && inputs.base_model != ''
        env:
          BASE_MODEL: ${{ inputs.base_model }}
        run: |
          if ! printf '%s' "$BASE_MODEL" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9.-]{0,63}$'; then
            echo "Modele illisible : $BASE_MODEL" >&2
            exit 1
          fi
          sed -i -E "s#^(PLANNER_MODEL|PLANNER_MODEL_PLAN|PLANNER_MODEL_BRIEF|PLANNER_MODEL_CHAT)=.*#\1=$BASE_MODEL#" ci/models.env
          grep -E '^PLANNER_MODEL' ci/models.env
      - name: Run unit regressions and real Minecraft tests
        # Une seule cle par banc, choisie au demarrage (ci/keyprobe.py) : mini
        # prompt sans raisonnement sur chaque cle ; primary si les deux
        # repondent, sinon celle qui repond, sinon echec. Seule la cle retenue
        # va au conteneur jetable des bots, jamais dans une image, un artefact
        # ou un journal. report.keyCheck verifie qu aucune autre n a servi.
        env:
          OPENCODE_PRIMARY_API_KEY: ${{ secrets.OPENCODE_PRIMARY_API_KEY }}
          OPENCODE_SECONDARY_API_KEY: ${{ secrets.OPENCODE_SECONDARY_API_KEY }}
          # Modeles openai/* de l A/B de modele seulement (API OpenAI en direct,
          # jamais un repli) ; absent, ces variantes ne se jouent pas.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CI_ENDPOINT_MODE: ip
          # Pool adaptatif (ci/capacity.py) : admissions sous 75 % de l enveloppe
          # (450 % sur 600 %) et 4 Gio de reserve CI + hote ; sans mesures
          # fiables, repli fixe a CI_POOL_SIZE (16, mesure a 400 %).
          # Fixe par defaut (comparaison meme graine, 800 %) : fixe 16 = 219 s
          # 65/65 ; adaptatif un a un 347 s, par lots 297 s puis 292 s (22
          # workers, deux niveaux perdus). L adaptatif reste au choix (dispatch).
          CI_POOL_MODE: ${{ inputs.pool_mode || 'fixed' }}
          # Enveloppe CI vue du runner (cgroupns prive : son /sys/fs/cgroup n est
          # que sa feuille) : slice user-1008 (podman-ci, CPUQuota 600 % depuis
          # le 2026-09-28, choix du proprietaire pour laisser de la marge aux
          # autres services de la machine ; MemoryHigh 14G, MemoryMax 16G) montee
          # en lecture seule par le quadlet du runner (rhada-server). Absente =>
          # repli fixe, ecrit dans le rapport.
          CI_METRICS_CGROUP: /host/ci-cgroup
          CI_ENVELOPE_CPU_PCT: '600'
          CI_POOL_SIZE: '16'
          CI_VARIATION_SEED: ${{ inputs.variation_seed }}
          CI_RANDOM_SEED: ${{ inputs.random_seed }}
          CI_LEVELS: ${{ steps.levels.outputs.levels }}
        run: python3 ci/run.py --suite "${{ steps.levels.outputs.suite }}"
      - name: Remove any remaining disposable test containers
        if: always()
        run: python3 ci/cleanup.py
      - name: Publish report, logs and movement traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minecraft-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  # Porte de fusion (decision du proprietaire, 2026-10-01) : vert seulement si
  # le banc COMPLET (`tout`) de ce commit a reussi. Un banc partiel le laisse
  # rouge : choisir des niveaux accelere le travail, jamais la fusion. Check
  # requis de la protection de `main`. Toujours execute (un check requis
  # SAUTE compte comme reussi) : banc saute = porte rouge. Runner heberge par
  # GitHub, sans checkout ni secret : il ne lit que deux sorties du banc.
  banc-complet:
    needs: minecraft
    if: always()
    runs-on: [self-hosted, linux, x64, minipc, podman]
    timeout-minutes: 5
    steps:
      - name: Full bench passed on this commit
        env:
          LEVELS: ${{ needs.minecraft.outputs.levels }}
          RESULT: ${{ needs.minecraft.result }}
          BASE_MODEL: ${{ inputs.base_model }}
        run: |
          if [ -n "$BASE_MODEL" ]; then
            echo "Modele du banc remplace ($BASE_MODEL) : mesure seulement, pas de fusion." >&2
            exit 1
          fi
          if [ "$RESULT" = skipped ] || [ -z "$LEVELS" ]; then
            echo "Banc saute ($RESULT) : aucun niveau joue, pas de fusion." >&2
            exit 1
          fi
          if [ "$LEVELS" != tout ]; then
            echo "Banc partiel ($LEVELS) : la fusion exige un banc complet reussi (commit sans ligne Banc:, ou Banc: tout)." >&2
            exit 1
          fi
          if [ "$RESULT" != success ]; then
            echo "Banc complet en echec ($RESULT) : pas de fusion." >&2
            exit 1
          fi
          echo "Banc complet reussi : fusion permise."
