services:
  minecraft:
    image: itzg/minecraft-server:2026.9.1-java25
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "26.1.2"
      MEMORY: 3G
      # 16 bots + 16 probes + harness : au-dela de 20 le serveur refuse ("server_full").
      MAX_PLAYERS: "48"
      ONLINE_MODE: "FALSE"
      MODE: survival
      FORCE_GAMEMODE: "TRUE"
      DIFFICULTY: peaceful
      SPAWN_PROTECTION: "0"
      LEVEL_TYPE: FLAT
      SEED: "24092026"
      GENERATE_STRUCTURES: "FALSE"
      VIEW_DISTANCE: "4"
      SIMULATION_DISTANCE: "4"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: disposable-ci-only
      RCON_CMDS_STARTUP: |-
        time set day
        gamerule advance_time false
    # Anonymous, disposable volume; never the live mc-data volume.
    volumes:
      - /data
  harness:
    build:
      context: ..
      dockerfile: ci/Dockerfile
    init: true
    environment:
      NODE_PATH: /work/bot/node_modules
    command: ["node", "/work/ci/harness.js", "TestProbe1", "--idle-secs", "600"]
    depends_on:
      minecraft:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/state').then(r=>r.json()).then(s=>process.exit(s.ready?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
  # Real bots (bot/index.js) for tree missions, one per level, run in parallel.
  # Same image as the harness; only started by the `trees` suite. Their only
  # secret is the planner key, read from the runner environment (GitHub
  # secret), never from a .env file.
  tree-bot-1: &tree-bot
    build:
      context: ..
      dockerfile: ci/Dockerfile
    init: true
    working_dir: /work/bot
    command: ["node", "index.js"]
    environment: &tree-bot-env
      NODE_PATH: /work/bot/node_modules
      MC_HOST: minecraft
      MC_PORT: "25565"
      MC_VERSION: "26.1"
      BOT_USERNAME: TreeBot1
      API_PORT: "3000"
      PLANNER_BASE_URL: https://opencode.ai/zen/go/v1
      PLANNER_MODEL: deepseek-v4.1-flash
      PLANNER_API_KEY: "${PLANNER_API_KEY:-}"
      PLANNER_SESSION_ID: minecraft-bot-ci-TreeBot1
      # Bots must not take each other's chat for orders (shared server).
      CHAT_IGNORE_PLAYERS: TreeBot1,TreeBot2,TreeBot3,TreeBot4,TreeBot5,TreeBot6,TreeBot7,TreeBot8,TreeBot9,TreeBot10,TreeBot11,TreeBot12,TreeBot13,TreeBot14,TreeBot15,TreeBot16,TestProbe1,TestProbe2,TestProbe3,TestProbe4,TestProbe5,TestProbe6,TestProbe7,TestProbe8,TestProbe9,TestProbe10,TestProbe11,TestProbe12,TestProbe13,TestProbe14,TestProbe15,TestProbe16,TestProbe17
      PLANNER_USER_AGENT: minecraft-bot/1.0
      PLANNER_TIMEOUT_MS: "20000"
      PLANNER_MAX_TOKENS: "2000"
      MISSION_MAX_STEPS: "90"
      MISSION_MAX_DURATION_MS: "900000"
      MISSION_DEFAULT_QUOTA: "16"
      MEMORY_FILE: /data/memory.json
      ACTIONS_DOC_FILE: /data/actions-doc.json
      OBJECTIVES_FILE: /data/objectives.json
      OBJECTIVES_EVENTS_FILE: /data/objectives-events.jsonl
      LOG_FILE: /data/bot.log
    # Anonymous volume: every run starts with no memory or objectives.
    volumes:
      - /data
    depends_on:
      minecraft:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/status').then(r=>r.json()).then(s=>process.exit(s.spawned?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 45
  tree-bot-2:
    <<: *tree-bot
    environment:
      <<: *tree-bot-env
      BOT_USERNAME: TreeBot2
      PLANNER_SESSION_ID: minecraft-bot-ci-TreeBot2
  tree-bot-3:
    <<: *tree-bot
    environment:
