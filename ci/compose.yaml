services:
  minecraft:
    # itzg/minecraft-server + Paper 26.1.2-74 deja telecharge et patche
    # (ci/paper/Dockerfile) : aucun telechargement au demarrage. PAPER_IMAGE
    # (tag stable par contenu du Dockerfile) est pose par ci/run.py, qui ne la
    # construit que si elle manque ; ci/cleanup.py garde ce tag.
    build:
      context: ./paper
    image: "${PAPER_IMAGE:-minebot-ci-paper:local}"
    environment:
      EULA: "TRUE"
      # Jar deja present dans /data : pas de resolution de version ni de
      # configs par defaut telechargees (Paper ecrit lui-meme les siennes).
      TYPE: CUSTOM
      CUSTOM_SERVER: /data/paper-26.1.2-74.jar
      # Tas Java : 1 G engage au depart, 2 G au plus (3 G fixes avant). Mesure
      # locale, 33 joueurs et 19 arenes chargees : tas vivant <= 662 MB apres
      # GC (-Xlog:gc ci-dessous). G1 ne grossit le tas que si le GC l exige.
      INIT_MEMORY: 1G
      MAX_MEMORY: 2G
      # 16 bots + 16 probes + harness : au-dela de 20 le serveur refuse ("server_full").
      MAX_PLAYERS: "48"
      ONLINE_MODE: "FALSE"
      MODE: survival
      FORCE_GAMEMODE: "TRUE"
      DIFFICULTY: peaceful
      SPAWN_PROTECTION: "0"
      LEVEL_TYPE: FLAT
      SEED: "24092026"
      GENERATE_STRUCTURES: "FALSE"
      VIEW_DISTANCE: "4"
      SIMULATION_DISTANCE: "4"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: disposable-ci-only
      RCON_CMDS_STARTUP: |-
        time set day
        gamerule advance_time false
      # /config is copied into /data before Paper starts: ci/paper/bukkit.yml
      # disables the per-IP login throttle (16 bots share one container IP).
      COPY_CONFIG_DEST: /data
      # One line per GC on stdout (containers.log): ci/run.py reads the live
      # heap after each collection to size MEMORY on measurements.
      JVM_XX_OPTS: "-Xlog:gc:stdout:uptime"
    # Meme sonde que l image itzg, mais toutes les secondes pendant le
    # demarrage (5 s par defaut) : `up --wait` rend la main des que Paper repond.
    healthcheck:
      test: ["CMD-SHELL", "mc-health"]
      interval: 30s
      start_period: 120s
      start_interval: 1s
      retries: 2
    # RCON reached directly by ci/run.py (a docker exec per command costs ~1 s
    # on Windows). Loopback only, random host port, disposable password.
    ports:
      - "127.0.0.1::25575"
    # Anonymous, disposable volume; never the live mc-data volume.
    volumes:
      - /data
      - ./paper/bukkit.yml:/config/bukkit.yml:ro
  # One test image per run (built once, from the harness service); every other
  # service reuses it. CI_TAG is the disposable project name set by ci/run.py,
  # and ci/run.py / ci/cleanup.py remove minebot-ci:<project> at the end.
  harness:
    build:
      context: ..
      dockerfile: ci/Dockerfile
    image: "minebot-ci:${CI_TAG:-local}"
    init: true
    environment:
      NODE_PATH: /work/bot/node_modules
    command: ["node", "/work/ci/harness.js", "TestProbe1", "--idle-secs", "600"]
    ports:
      - "127.0.0.1::3101"
    depends_on:
      minecraft:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/state').then(r=>r.json()).then(s=>process.exit(s.ready?0:1)).catch(()=>process.exit(1))"]
      # Every second while starting, then every 30 s: a check is one node
      # process (~40 MB, ~0.1 s CPU), no reason to keep one every 2-3 s.
      interval: 30s
      timeout: 3s
      start_period: 120s
      start_interval: 1s
      retries: 3
  # Real bots (bot/index.js) for the tree/join/chat levels: ONE container, one
  # `node index.js` process per bot (ci/multi-bot.js), TreeBotN listening on
  # API_PORT 3000+N with its own state under /data/botN/. Only started by the
  # `trees` suite. Their only secret is the planner key, read from the runner
  # environment (GitHub secret), never from a .env file.
  bots:
    image: "minebot-ci:${CI_TAG:-local}"
    pull_policy: never
    init: true
    working_dir: /work/bot
    command: ["node", "/work/ci/multi-bot.js", "bots"]
    # Base et modeles du planificateur, par usage : ci/models.env (sans secret).
    env_file: [models.env]
    # Bot APIs reached directly by ci/run.py; loopback only, random host ports.
    # One line per pool worker (POOL_SIZE in ci/trees.py).
    ports:
      - "127.0.0.1::3001"
      - "127.0.0.1::3002"
      - "127.0.0.1::3003"
      - "127.0.0.1::3004"
      - "127.0.0.1::3005"
      - "127.0.0.1::3006"
      - "127.0.0.1::3007"
      - "127.0.0.1::3008"
      - "127.0.0.1::3009"
      - "127.0.0.1::3010"
      - "127.0.0.1::3011"
      - "127.0.0.1::3012"
      - "127.0.0.1::3013"
      - "127.0.0.1::3014"
      - "127.0.0.1::3015"
      - "127.0.0.1::3016"
    environment:
      NODE_PATH: /work/bot/node_modules
      # Jeune generation V8 plafonnee a 4 MB par demi-espace (defaut bien plus
      # grand) : mesure locale, 16 bots au repos 1,98 GB -> 1,10 GB, CPU egal.
      NODE_OPTIONS: "--max-semi-space-size=4"
      POOL_SIZE: "16"
      API_BASE_PORT: "3000"
      # V8 heap cap of each bot process (NODE_OPTIONS=--max-old-space-size).
      # Offline, a bot idles at ~110-135 MB RSS with ~25 MB of heap; chunks,
      # pathfinding and the planner add to that once in the world.
      BOT_MAX_OLD_SPACE_MB: "256"
      # One child every 300 ms (1000 ms before): the 16 bots are in the
      # world ~11 s sooner, 7 CPUs absorb the module-loading burst.
      CONNECT_STAGGER_MS: "300"
      MC_HOST: minecraft
      MC_PORT: "25565"
      MC_VERSION: "26.1"
      # BOT_USERNAME, API_PORT, PLANNER_SESSION_ID and the /data/botN/ files
      # (memory, actions doc, objectives, log) are set per child by multi-bot.js.
      PLANNER_API_KEY: "${PLANNER_API_KEY:-}"
      # Bots must not take each other's chat for orders (shared server).
      CHAT_IGNORE_PLAYERS: TreeBot1,TreeBot2,TreeBot3,TreeBot4,TreeBot5,TreeBot6,TreeBot7,TreeBot8,TreeBot9,TreeBot10,TreeBot11,TreeBot12,TreeBot13,TreeBot14,TreeBot15,TreeBot16,TestProbe1,TestProbe2,TestProbe3,TestProbe4,TestProbe5,TestProbe6,TestProbe7,TestProbe8,TestProbe9,TestProbe10,TestProbe11,TestProbe12,TestProbe13,TestProbe14,TestProbe15,TestProbe16,TestProbe17
      PLANNER_USER_AGENT: minecraft-bot/1.0
      PLANNER_TIMEOUT_MS: "30000"
      # Mesure : 86 % des jetons produits etaient du raisonnement (~3,9 s/plan).
      PLANNER_THINKING: disabled
      PLANNER_MAX_TOKENS: "2000"
      MISSION_MAX_STEPS: "90"
      MISSION_MAX_DURATION_MS: "900000"
      MISSION_DEFAULT_QUOTA: "16"
    # 16 processes x (256 MB heap cap + ~100 MB code/buffers) stays under it;
    # past it the kernel kills a bot, which the healthcheck and logs show.
    mem_limit: 6g
    # Anonymous volume: every run starts with no memory or objectives.
    volumes:
      - /data
    depends_on:
      minecraft:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # Healthy only when every child is alive AND answers /api/status spawned=true.
    healthcheck:
      test: ["CMD", "node", "/work/ci/multi-bot.js", "health"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      start_interval: 1s
      retries: 3
  # Silent probe players standing in for the human requester (one per worker),
  # TestProbe2..17: ONE node process (ci/probes.js), one shared minecraft-data
  # registry instead of 16 processes (~100 MB each).
  probes:
    image: "minebot-ci:${CI_TAG:-local}"
    pull_policy: never
    init: true
    environment:
      NODE_PATH: /work/bot/node_modules
      # Same V8 young-generation cap as `bots`.
      NODE_OPTIONS: "--max-semi-space-size=4"
    command: ["node", "/work/ci/probes.js", "TestProbe2", "TestProbe3", "TestProbe4", "TestProbe5", "TestProbe6", "TestProbe7", "TestProbe8", "TestProbe9", "TestProbe10", "TestProbe11", "TestProbe12", "TestProbe13", "TestProbe14", "TestProbe15", "TestProbe16", "TestProbe17", "--idle-secs", "1700"]
    mem_limit: 768m
    depends_on:
      minecraft:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # Children alive only; being in the world is checked by RCON in ci/run.py.
    healthcheck:
      test: ["CMD", "node", "/work/ci/multi-bot.js", "health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 1s
      retries: 3
